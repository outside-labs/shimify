name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SHIMIFY_PILOT_PATH: ${{ github.workspace }}/build/pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Install pinned build-only pilot
        run: >-
          uv pip install --python 3.14 --target build/pilot --no-deps
          --only-binary :all: --require-hashes -r tests/pilot-requirements.txt
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --no-sync python scripts/check_wheel.py
