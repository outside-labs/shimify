name: Publish Shimify to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shimify-pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHIMIFY_PILOT_PATH: ${{ github.workspace }}/build/pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'shimify'
          assert os.environ['RELEASE_TAG'] == 'v' + project['version'], 'Tag must match the package version'
          PY
      - run: uv sync --locked
      - name: Install hashed acceptance pilot
        run: >-
          uv pip install --python 3.14 --target build/pilot --no-deps
          --only-binary :all: --require-hashes -r tests/pilot-requirements.txt
      - name: Run regression and differential pilot tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv build
      - name: Check distribution metadata
        run: uvx --from twine twine check --strict dist/*
      - name: Test isolated wheel
        run: uv run --no-sync python scripts/check_wheel.py
      - uses: actions/upload-artifact@v5
        with:
          name: shimify-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shimify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: shimify-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
